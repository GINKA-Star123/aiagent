[project]
name = "aiagent"
version = "0.1.0"
description = "Unified AI VTuber runtime"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34,<2",
    "dotenv>=0.9.9",
    "faiss-cpu>=1.15.1",
    "fastapi>=0.148.0",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "langchain>=1.2.15",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.12",
    "langchain-huggingface>=1.2.3",
    "langchain-openai>=0.2.14",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.1.10",
    "langgraph-checkpoint>=4.1.1,<5.0.0",
    "langgraph-checkpoint-redis==0.5.2",
    "langmem>=0.0.30",
    "mem0ai>=2.0.1",
    "neo4j>=5.20.0",
    "numpy>=2.4.4",
    "ollama>=0.6.1",
    "openai>=2.32.0",
    "pillow>=13.0.0",
    "pydantic>=2.13.2",
    "pydantic-settings>=2.16.0",
    "pygame>=2.6.1",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "redis>=7.4,<8",
    "scipy>=1.17.1",
    "sentence-transformers>=6.1.0",
    "sounddevice>=0.5.6",
    "uvicorn>=0.54.0",
    "torch==2.14.1"
]

[project.optional-dependencies]
dev = [
    "packaging>=26.1",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
# 只声明仓库中真实存在的包：
# - 移除 domain*（该目录已不存在）
# - 补上 cloud*（真实存在且被 apps/tests 依赖，历史上漏声明）
include = ["aiagent*", "apps*", "cloud*", "config*", "integrations*"]
exclude = ["data*", "tests*", "docs*", "scripts*", "deploy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 现有测试使用 pytest.mark.anyio（anyio 插件注册）与 skipif；
# 下面登记项目自有的分层标记，便于后续用 -m 筛选。
markers = [
    "unit: 纯单元测试，不依赖网络与外部服务",
    "api: FastAPI 契约测试（TestClient）",
    "smoke: mock runtime 主链路冒烟",
    "rag: 检索质量基线评测",
    "integration: 需要真实外部服务，默认不参与 CI",
]
filterwarnings = [
    "ignore::DeprecationWarning:trustcall.*",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".venv",
    "data",
    "third_party",
    "gpu_services",
    "_tmp",
    "apps/flutter_client",
    "apps/desktop_qt",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # 行宽交给 formatter，长中文注释不强制折行
    "E402",  # 仓库存在"先做 sys.path 处理再 import"的脚本
]

[tool.ruff.lint.per-file-ignores]
"apps/api/routes/*" = ["B008"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]