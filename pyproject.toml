[project]
name = "aiagent"
version = "0.1.0"
description = "Unified AI VTuber runtime"
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "langchain>=1.2.15",
    "langchain-openai>=0.2.14",
    "langgraph>=1.1.10",
    "mem0ai>=2.0.1",
    "neo4j>=5.20.0",
    "ollama>=0.6.1",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
# 只声明仓库中真实存在的包：
# - 移除 domain*（该目录已不存在）
# - 补上 cloud*（真实存在且被 apps/tests 依赖，历史上漏声明）
include = ["aiagent*", "apps*", "cloud*", "config*", "integrations*"]
exclude = ["data*", "tests*", "docs*", "scripts*", "deploy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 现有测试使用 pytest.mark.anyio（anyio 插件注册）与 skipif；
# 下面登记项目自有的分层标记，便于后续用 -m 筛选。
markers = [
    "unit: 纯单元测试，不依赖网络与外部服务",
    "api: FastAPI 契约测试（TestClient）",
    "smoke: mock runtime 主链路冒烟",
    "rag: 检索质量基线评测",
    "integration: 需要真实外部服务，默认不参与 CI",
]
filterwarnings = [
    "ignore::DeprecationWarning:trustcall.*",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".venv",
    "data",
    "third_party",
    "gpu_services",
    "_tmp",
    "apps/flutter_client",
    "apps/desktop_qt",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # 行宽交给 formatter，长中文注释不强制折行
    "E402",  # 仓库存在"先做 sys.path 处理再 import"的脚本
]

[tool.ruff.lint.per-file-ignores]
"apps/api/routes/*" = ["B008"]
